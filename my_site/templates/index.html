<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой милый сайтик 🐾</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- ЭКРАН ЗАГРУЗКИ -->
    <div class="loading-screen">
        <div class="terminal">
            <p class="load-text text-1">>> это загрузка просто для пафоса...</p>
            <p class="load-text text-2">>> лол...</p>
            <p class="load-text text-3">>> на самом деле ничего не загружается...</p>
            <p class="load-text text-4">>> щас щас загрузится!!</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div class="main-screen">
        <div class="stars-container">
            <img src="/static/images/stars.png" class="stars-img" alt="Звезды">
        </div>
        
        <img src="/static/images/cat.png" class="cat-img" alt="Котик">
        
        <div class="menu-buttons">
            <a href="/video" class="cute-btn">Посмотреть видео с котиками ( &gt;_&lt; )</a>
            <img src="/static/images/sparkles.png" class="sparkle-icon" alt="Блеск">
            <a href="/info" class="cute-btn">Информация о котиках (0_o)</a>
        </div>
    </div>

</body>
</html>
